worker_processes auto;

events {
    # PRD 决策 1：50 员工 × 2 连接 + 余量
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # 前端静态资源 + API 反向代理
    server {
        listen 80;
        server_name _;

        # 前端 SPA (dist/)
        root /var/www/html;
        index index.html;

        # 所有非 API 路由都返回 index.html（SPA）
        location / {
            try_files $uri $uri/ /index.html;
        }

        # API 反向代理
        location /api/ {
            proxy_pass http://api:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-Id $request_id;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # FastAPI docs
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
        }

        # ────────────────────────────────────────────────────
        # NATS WebSocket 反向代理
        # PRD 决策 1：前端通过 wss://面板域名/ws/nats 连接 NATS
        # Nginx 做 TLS 终止 + 身份透传，NATS 层做 topic 权限校验
        # ────────────────────────────────────────────────────
        location /ws/nats/ {
            proxy_pass http://nats:9222/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # 透传前端 JWT，NATS JWT 认证使用
            proxy_set_header X-NATS-User $http_authorization;
            # WS 长连接超时：60s 无数据自动断连
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # 文件健康检查
        location /health {
            proxy_pass http://api:8000/health;
        }
    }

    # HTTPS（生产环境）
    # server {
    #     listen 443 ssl;
    #     server_name your-domain.com;
    #     ssl_certificate /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     # ... 同 HTTP server 的 location 配置
    # }
}
