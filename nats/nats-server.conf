# NATS JetStream 配置
# PRD 决策 1：持久化 + 资源限制 + WS 端口
# 生产环境需加 JWT 认证配置

listen: 0.0.0.0:4222
http: 0.0.0.0:8222

# WebSocket（内网，由 Nginx 反向代理）
websocket {
  port: 9222
  no_tls: true
}

jetstream {
  store_dir: /data
  max_mem: 256MB
  max_file: 1GB
}

# 资源限制（PRD §3.1）
max_payload: 10MB

# 日志
log_time: true
debug: false
